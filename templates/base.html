<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{%block title%} AI Review Notes {%endblock%}</title>
  
  <link rel="icon" href="{{ url_for('static',filename='images/logo-only.png') }}" />

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  
  <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#f7f9ff",
                        "surface-dim": "#d7dadf",
                        "surface-bright": "#f7f9ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f1f4f9",
                        "surface-container": "#ebeef3",
                        "surface-container-high": "#e5e8ee",
                        "surface-container-highest": "#e0e3e8",
                        "on-surface": "#181c20",
                        "on-surface-variant": "#434750",
                        "inverse-surface": "#2d3135",
                        "inverse-on-surface": "#eef1f6",
                        "outline": "#737781",
                        "outline-variant": "#c3c6d1",
                        "surface-tint": "#375e9b",
                        "primary": "#003065",
                        "on-primary": "#ffffff",
                        "primary-container": "#1c4782",
                        "on-primary-container": "#92b7f9",
                        "inverse-primary": "#aac7ff",
                        "secondary": "#835400",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#fcab27",
                        "on-secondary-container": "#694300",
                        "tertiary": "#303232",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#464848",
                        "on-tertiary-container": "#b6b6b7",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "background": "#f7f9ff",
                        "on-background": "#181c20",
                        "surface-variant": "#e0e3e8"
                    },
                    borderRadius: {
                        sm: "0.125rem",
                        DEFAULT: "0.25rem",
                        md: "0.375rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    fontFamily: {
                        headline: ["Manrope", "sans-serif"],
                        body: ["Work Sans", "sans-serif"],
                        label: ["Work Sans", "sans-serif"]
                    },
                    spacing: {
                        'unit': '4px',
                        'gutter': '24px',
                        'margin': '32px'
                    }
                }
            }
        }
  </script>
  <style>
      body { font-family: 'Work Sans', sans-serif; background-color: #f7f9ff; color: #181c20; }
      h1, h2, h3, h4, h5, h6 { font-family: 'Manrope', sans-serif; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
      .sidebar-active { background-color: rgba(255, 255, 255, 0.1); border-left: 4px solid #fcab27; }
  </style>

  {%block customCss%} {%endblock%}
</head>

<body class="bg-background text-on-background min-h-screen flex antialiased">
  <!-- Sidebar Navigation -->
  <aside class="w-64 bg-primary text-white flex-shrink-0 flex flex-col fixed h-full z-50">
    <div class="p-8">
      <a href="/" class="flex flex-col gap-2 group">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-3xl text-secondary-container">account_balance</span>
            <span class="text-xl font-extrabold tracking-tight">PHM</span>
        </div>
        <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-on-primary-container opacity-80">Professional Financial Portal</span>
      </a>
    </div>
    
    <nav class="flex-grow px-4 space-y-2 mt-4">
      <a href="/" class="flex items-center gap-4 px-4 py-3 rounded-md hover:bg-white/5 transition-colors {% if request.path == '/' %}sidebar-active{% endif %}">
        <span class="material-symbols-outlined">dashboard</span>
        <span class="font-medium text-sm">Dashboard</span>
      </a>
    </nav>
    
    <div class="p-4 mt-auto border-t border-white/10">
      <a href="https://phm-accountants.co.uk/" target="_blank" class="flex items-center gap-4 px-4 py-3 rounded-md bg-secondary-container text-on-secondary-container hover:bg-secondary-container/90 transition-colors font-bold text-xs uppercase tracking-wider justify-center">
          PHM Website
      </a>
      <div class="mt-4 flex flex-col items-center gap-2 text-[10px] text-white/40 uppercase tracking-widest font-bold">
        <span>© 2024 PHM</span>
        <span>Precision Etched</span>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex-grow ml-64 flex flex-col min-h-screen">
    <!-- Top Bar / Header -->
    <header class="h-16 bg-white border-b border-outline-variant/30 flex items-center justify-between px-8 sticky top-0 z-40 shadow-sm">
      <div class="flex items-center gap-4">
        <span class="text-on-surface-variant font-medium text-sm">Welcome back,</span>
        <span class="text-primary font-bold text-sm">Analyst</span>
      </div>
      
      <div class="flex items-center gap-4">
        <button class="p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
            <span class="material-symbols-outlined">notifications</span>
        </button>
        <div class="h-8 w-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold text-xs">
            JA
        </div>
      </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-grow p-8 max-w-[1280px] w-full mx-auto">
      {%block main%} {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="p-8 bg-surface-container-lowest border-t border-outline-variant/20 text-on-surface-variant">
      <div class="flex flex-col md:flex-row justify-between items-center text-[10px] font-bold uppercase tracking-widest">
        <p>© 2024 PHIPPS HENSON MCALLISTER</p>
        <div class="flex gap-8 mt-4 md:mt-0">
          <a class="hover:text-primary transition-colors" href="#">Privacy</a>
          <a class="hover:text-primary transition-colors" href="#">Terms</a>
          <a class="hover:text-primary transition-colors" href="#">Support</a>
        </div>
      </div>
    </footer>
  </div>

  {%block customJs%}{%endblock%}
</body>
</html>
